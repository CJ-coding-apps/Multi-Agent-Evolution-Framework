name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm first so setup-node's pnpm cache can find it. Version comes from the
      # `packageManager` field in package.json (pnpm@8.15.1).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc, leaf-first)
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (node:test across all packages)
        run: pnpm -r test
