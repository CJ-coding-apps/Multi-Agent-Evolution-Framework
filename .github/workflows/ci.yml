name: CI

on:
  push:
    branches: [main, 'wp/phase-*']
  # Deliberately no branch filter. With `branches: [main]` here, a pull request
  # whose base is any other branch -- which is how a change is stacked on
  # another unmerged change -- got no CI at all, and "no checks reported" in the
  # pull request then reads much like "checks passed". Every pull request runs CI.
  pull_request:

# Cancel in-progress runs for the same ref when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workflow files are the one thing here with no other gate. A job that
  # quietly stops running, or an expression that never resolves, looks exactly
  # like a green build — and this repository's whole claim is that its gates
  # mean something. actionlint reads the files directly: expression syntax,
  # job-graph references, and the shell inside each `run:` block, through
  # shellcheck, which the pinned image ships.
  actionlint:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  build-test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm first so setup-node's pnpm cache can find it. Version comes from the
      # `packageManager` field in package.json (pnpm@10.34.7).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc, leaf-first)
        run: pnpm build

      # Guards the three ways a green build or a green test run can mean nothing:
      # tsc reporting success without emitting (a stale tsBuildInfoFile outside dist),
      # `pnpm -r test` skipping a package that has tests but no test script, and a
      # workspace dependency cycle (which pnpm tolerates and `tsc -b` does not).
      - name: Guard build output
        run: pnpm check:build-output

      - name: Guard test scripts
        run: pnpm check:test-scripts

      - name: Guard workspace dependencies
        run: pnpm check:workspace-deps

      # A comment citing a document this repo does not ship reads as provenance and
      # resolves to nothing. 39 of them accumulated before anyone noticed.
      - name: Guard doc references
        run: pnpm check:doc-refs

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test (node:test across all packages)
        run: pnpm -r test

  # D-24: CI proves what the README demonstrates. The unit suites test the pieces; this job runs
  # the two commands a user is told to try on a fresh clone, as built, against real Kùzu and
  # better-sqlite3, and fails unless the demo's bundle verifies and the offline goldens reproduce
  # the committed baseline exactly.
  e2e:
    name: e2e · demo · attestation · offline goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Named explicitly so `run:` gets `-o pipefail`; the implicit default shell does not, and the
    # demo's exit status would be lost in its `| tee`.
    defaults:
      run:
        shell: bash
    env:
      # A throwaway key, not a secret: it makes the demo sign with a key of its own, so its bundle
      # records keySource "env" as a real run's should. Nothing outside this job trusts it.
      MAF_SIGNING_KEY: ci-e2e-throwaway-signing-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc, leaf-first)
        run: pnpm build

      - name: In-process demo (scripted model, offline)
        run: node packages/cli/dist/main.js inprocess-demo | tee "$RUNNER_TEMP/demo.log"

      # The demo fails when it cannot write its bundle, but the line it prints is only a path, so the
      # file is checked, not the line. The last check is the control: the same bundle under another
      # key must not verify, or a pass above would mean nothing.
      - name: Verify the demo's attestation bundle
        run: |
          bundle=$(sed -n 's/^attn signed bundle: *//p' "$RUNNER_TEMP/demo.log")
          if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
            echo "::error::inprocess-demo wrote no attestation bundle (path it printed: '${bundle:-none}')."
            exit 1
          fi
          node packages/cli/dist/main.js attest verify "$bundle" | tee "$RUNNER_TEMP/verify.log"
          if ! grep -q '^keySource: env ' "$RUNNER_TEMP/verify.log"; then
            echo "::error::the bundle was not checked against MAF_SIGNING_KEY, so a valid signature proves nothing."
            exit 1
          fi
          if MAF_SIGNING_KEY=not-the-key-it-was-signed-with node packages/cli/dist/main.js attest verify "$bundle" >/dev/null 2>&1; then
            echo "::error::the demo's bundle verified under a key it was not signed with."
            exit 1
          fi

      - name: Self-test the goldens comparator
        run: node scripts/compare-goldens.mjs --self-test

      # Run in the checkout itself, which holds what a fresh clone gives a user: the committed
      # policy, default harness and corpus, and no state. The result lands in
      # .maf/goldens/results/<harnessSha>.scripted.json.
      - name: Offline goldens (scripted adapter, real Kùzu)
        run: node packages/cli/dist/main.js goldens run --adapter scripted --corpus tests/goldens -d .

      - name: Compare the goldens result to the baseline (ranAt ignored)
        run: |
          shopt -s nullglob
          results=(.maf/goldens/results/*.scripted.json)
          if [ "${#results[@]}" -ne 1 ]; then
            echo "::error::expected one scripted result in .maf/goldens/results, found ${#results[@]}."
            exit 1
          fi
          node scripts/compare-goldens.mjs tests/goldens/baseline.json "${results[0]}"

  # Everything above tests the checkout. This job tests the published artifact: it packs the package
  # with npm, installs the tarball into an empty prefix, and runs the two commands the README leads
  # with — from a directory that is not this repository. The e2e job would pass with a tarball that
  # lacked the assets, the manifest dependencies or the shebang, because it runs `dist/main.js` in
  # place; this one cannot.
  #
  # WP-3.0p: the artifact is tested on every platform 0.6.0 claims, not only on the one that was
  # convenient. `fail-fast: false` matters more than it looks: if the tarball cannot install on one
  # platform, the other three still have to report, or the failure reads like a matrix that never ran.
  package:
    name: package · npm pack · install · run (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15 is Apple Silicon; macos-15-intel is x86_64. GitHub's macos-14 arm64 image is
          # deprecated, so both macOS legs use the 15 image family.
          - os: macos-15
            platform: macOS arm64
          - os: macos-15-intel
            platform: macOS x64
          - os: ubuntu-24.04
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc, leaf-first)
        run: pnpm build

      - name: Pack, install from the tarball, and run it
        run: pnpm check:package

  # WP-3.0p, second question (D-51). The job above installs the version this package pins today
  # (Kùzu 0.7.1) as part of its own dependencies. This job asks the same question of the version
  # 0.6.0 intends to pin, 0.11.3, and asks it alone — no pnpm workspace, no build, nothing that could
  # supply a compiler by accident. If any platform has no prebuilt binary, it compiles from source or
  # fails, and the upgrade does not proceed: Kùzu is archived, so a platform that must build its own
  # copy of 0.11.3 has no upstream to repair the build when it breaks.
  kuzu-probe:
    name: kuzu 0.11.3 prebuilt (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS arm64
          - os: macos-15-intel
            platform: macOS x64
          - os: ubuntu-24.04
            platform: Linux x64
          - os: ubuntu-24.04-arm
            platform: Linux arm64
    # Explicit bash so `set -o pipefail` is real: without it the `| tee` in the install step would
    # hide npm's exit status.
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install kuzu@0.11.3, prove it is prebuilt, and run one query
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/kuzu-probe"
          log="$RUNNER_TEMP/kuzu-install.log"
          mkdir -p "$work"
          cd "$work"
          npm init -y >/dev/null
          npm install kuzu@0.11.3 --foreground-scripts 2>&1 | tee "$log"

          echo '--- platform ---'
          node -e 'const os=require("os"); console.log(process.platform, process.arch, process.version, os.release())'
          echo '--- resolved ---'
          npm ls kuzu
          echo '--- native binary ---'
          find node_modules/kuzu -name '*.node' -print -exec ls -l {} \;
          # A prebuilt install must leave a loadable binary; a build-from-source also leaves one, so
          # the log below carries the verdict, and this check catches the case where neither happened.
          if ! find node_modules/kuzu -name '*.node' -print -quit | grep -q .; then
            echo "::error::kuzu@0.11.3 installed no native binary on ${{ matrix.platform }}."
            exit 1
          fi

          # Compilation signatures. `prebuild-install warn install No prebuilt binaries found` is the
          # decision to build; the rest are the build itself. The plain string `prebuild-install info`
          # is the normal prebuilt path and is not matched.
          if grep -Eqi 'no prebuilt binaries found|prebuild-install (warn|error)|node-gyp|gyp info|gyp ERR|CMake Error|^cmake |\.cpp\.o|\.cc\.o' "$log"; then
            echo "::error::kuzu@0.11.3 compiled from source (or tried to) on ${{ matrix.platform }}:"
            grep -Ein 'no prebuilt binaries found|prebuild-install (warn|error)|node-gyp|gyp info|gyp ERR|CMake Error|^cmake |\.cpp\.o|\.cc\.o' "$log" || true
            exit 1
          fi

          # A prebuilt that cannot load is not a prebuilt. Execute one query through the real API.
          node - <<'NODE'
          const kuzu = require('kuzu');
          (async () => {
            const db = new kuzu.Database(':memory:');
            const conn = new kuzu.Connection(db);
            const res = await conn.query('RETURN 1 AS n');
            const rows = typeof res.getAll === 'function' ? await res.getAll() : [await res.getNext()];
            console.log('query result:', JSON.stringify(rows));
            if (rows.length !== 1 || Number(rows[0].n) !== 1) {
              throw new Error(`expected one row with n = 1, got ${JSON.stringify(rows)}`);
            }
            if (typeof conn.close === 'function') await conn.close();
            if (typeof db.close === 'function') await db.close();
            console.log('kuzu 0.11.3: prebuilt binary loaded and executed a query');
          })().catch((err) => { console.error(err); process.exit(1); });
          NODE
